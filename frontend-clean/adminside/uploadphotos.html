<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Upload Photos | GeethsConnect</title>
<link rel="stylesheet" href="../common/css/style.css" />
</head>

<body>

<div class="topbar">

  <span class="menu-btn" onclick="toggleSidebar()">☰</span>

  <h2 class="logo-text">GEETHAYAANA 2026</h2>

</div>

<div id="sidebar" class="sidebar">
  <a href="admindashboard.php">🏠 Dashboard</a>
  <a href="addevent.php">➕ Add Event</a>
  <a href="uploadphotos.html">🖼️ Upload Photos</a>
  <a href="/GEETHAYAANA/frontend-clean/studentside/login.html">Logout</a>
</div>

<section class="container" style="padding:30px 0;">
<div class="card">
<h1>🖼️ Upload Photos</h1>
<p style="color:var(--muted);">Upload event photos.</p>
</div>
</section>

<section class="container">

<div class="card">
<h2>➕ Upload New Photo</h2>

<form id="photoForm">
<label>Photo Title</label>
<input type="text" id="photoTitle" required />

<label>Select Image</label>
<input type="file" id="photoFile" accept="image/*" required />

<button class="btn orange" type="submit">Upload</button>
</form>
</div>

<div class="card" style="margin-top:20px;">
<h2>📌 Uploaded Photos</h2>
<div id="photoList"></div>
</div>

</section>

<footer class="footer">
<div class="container">
© 2026 GEETHAYAANA
</div>
</footer>

<script>

const photoForm = document.getElementById("photoForm");
const photoList = document.getElementById("photoList");

/* GET PHOTOS */
function getPhotos(){
return JSON.parse(localStorage.getItem("photos")) || [];
}

/* SAVE PHOTOS */
function savePhotos(data){
localStorage.setItem("photos", JSON.stringify(data));
}

/* SHOW PHOTOS */
function renderPhotos(){

const photos = getPhotos();
photoList.innerHTML = "";

if(photos.length === 0){
photoList.innerHTML = "<p>No photos uploaded yet</p>";
return;
}

photos.forEach((p, index)=>{

photoList.innerHTML += `
<div class="card" style="margin-top:10px;">
<img src="${p.img}" style="width:100%;height:180px;object-fit:cover;">
<h3>${p.title}</h3>
<p>${p.date}</p>
<button onclick="deletePhoto(${index})" class="btn outline">Delete</button>
</div>
`;

});

}

/* DELETE */
function deletePhoto(index){
let photos = getPhotos();
photos.splice(index,1);
savePhotos(photos);
renderPhotos();
}

/* UPLOAD */
photoForm.addEventListener("submit", function(e){

e.preventDefault();

const title = document.getElementById("photoTitle").value;
const file = document.getElementById("photoFile").files[0];

if(!file){
alert("Select image");
return;
}

const reader = new FileReader();

reader.onload = function(){

const newPhoto = {
title: title,
img: reader.result,
date: new Date().toLocaleString()
};

let photos = getPhotos();
photos.unshift(newPhoto);

savePhotos(photos);

alert("Uploaded!");
photoForm.reset();
renderPhotos();

};

reader.readAsDataURL(file);

});

renderPhotos();

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("active");
}

</script>

</body>
</html>
