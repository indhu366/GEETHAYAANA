<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | GeethsConnect</title>

<style>
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  background: linear-gradient(135deg, #11213f, #2a5298);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

.forgot-container {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.forgot-card {
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(12px);
  padding: 30px;
  width: 350px;
  border-radius: 12px;
  color: #fff;
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  text-align: center;
}

.forgot-card h2 {
  margin-bottom: 20px;
}

.forgot-card input {
  width: 100%;
  padding: 10px;
  margin-bottom: 15px;
  border: none;
  border-radius: 6px;
  outline: none;
}

.forgot-card button {
  width: 100%;
  padding: 10px;
  background: #ff7a18;
  border: none;
  border-radius: 6px;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

.forgot-card button:hover {
  background: #ff5200;
}

.forgot-card a {
  color: #fff;
  text-decoration: none;
  font-size: 14px;
}

.forgot-card a:hover {
  text-decoration: underline;
}
</style>

</head>

<body>

<div class="forgot-container">
  <div class="forgot-card">
    
    <h2>Forgot Password</h2>

    <form action="../../backend/forgotPassword.php" method="POST">
      
      <input type="email" name="email" placeholder="Enter your email" required>
      
      <input type="password" name="newPassword" placeholder="New Password" required>

      <button type="submit">Reset Password</button>

    </form>

    <p style="margin-top:10px;">
      <a href="login.html">← Back to Login</a>
    </p>

  </div>
</div>

</body>
</html>
