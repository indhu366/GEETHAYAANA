<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Register | GeethsConnect</title>
  <link rel="stylesheet" href="../common/css/style.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: url("https://media.collegedekho.com/media/img/institute/crawled_images/GSSSM.jpg") no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .auth-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-card {
      backdrop-filter: blur(12px);
      background: rgba(238, 234, 234, 0.08);
      border-radius: 15px;
      padding: 30px;
      width: 350px;
      color: #fff;
      box-shadow: 0 8px 32px rgba(11, 8, 8, 0.3);
    }

    .auth-card h2,
    .auth-card p,
    .auth-card label,
    .auth-card a {
      color: #ffffff;
    }

    .auth-card input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      outline: none;
    }

    .auth-card input::placeholder {
       color: rgba(9, 9, 9, 0.7);
    }

    .auth-card select{
      width:100%;
      padding:10px;
      margin-bottom:15px;
      border:1px solid rgba(255,255,255,0.4);
      background:rgba(255,255,255,0.15);
      color:#050404;
      outline:none;
    }

    .btn.full {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .small-link {
      margin-top: 10px;
      text-align: center;
      color: #080606;
    }

    .small-link a {
      color: #030303;
      text-decoration: none;
    }

  </style>

</head>

<body>

<div class="auth-wrap">
  <div class="card auth-card">
    <h2>Create Account</h2>
    

  <form action="/GEETHAYAANA/backend/registerUser.php" method="POST">

  <input type="text" name="name" placeholder="Name" required>
  <input type="email" name="email" placeholder="Email" required>

  <select name="role" required>
    <option value="">Select Role</option>
    <option value="student">Student</option>
    <option value="admin">Faculty</option>
  </select>

  <input type="password" name="password" placeholder="Password" required>

  <button type="submit">Register</button>

</form>

    <div class="small-link">
      Already registered? <a href="login.html">Login</a>
    </div>

    <div class="small-link">
      <a href="../index.html">⬅ Back to Home</a>
    </div>

  </div>
</div>

<div id="successPopup" class="popup">
  <div class="popup-box">
    <h3>🎉 Registered Successfully!</h3>
    <p>You can now login.</p>
    <a href="login.html">Login</a>
  </div>
</div>

</body>
</html>
